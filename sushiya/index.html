<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sushi Ya El Masnou · demo sírvelo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{ --bg:#0B0B0C; --card:#16161A; --card2:#1F1F25; --line:#2C2C33; --ink:#F4F4F5; --soft:#A1A1AA; --red:#D7141C; --red2:#7A0F12; --ok:#22C55E; --okbg:#0F2A18; --warn:#F59E0B; --warnbg:#3B2A06; }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif;}
  button{font-family:inherit;}
  .switch{position:sticky; top:0; z-index:50; display:flex; justify-content:center; align-items:center; gap:6px; padding:8px; background:#000; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .switch button{border:1px solid var(--line); background:transparent; color:var(--soft); font-size:12.5px; font-weight:600; padding:6px 13px; border-radius:99px; cursor:pointer;}
  .switch button.on{background:var(--red); border-color:var(--red); color:#fff;}
  .switch .demo{font-size:10px; color:var(--soft); letter-spacing:.12em;}
  .switch .turno{font-size:11.5px; color:var(--soft); margin-left:4px;}
  h1,h2,h3{font-family:'Anton',sans-serif; font-weight:400; letter-spacing:.02em; margin:0;}
  .brand{display:flex; align-items:center; justify-content:space-between; padding:14px 16px;}
  .logo{display:flex; align-items:center; gap:10px;}
  .logo .ring{width:34px; height:34px; border-radius:50%; border:4px solid var(--red); border-right-color:transparent; transform:rotate(-30deg);}
  .logo b{font-family:'Anton'; font-weight:400; font-size:22px; letter-spacing:.02em; line-height:1;}
  .logo small{display:block; font-family:'Anton'; font-size:11px; letter-spacing:.12em; color:var(--soft);}
  .pill{font-family:'Anton'; font-size:15px; background:var(--card2); padding:6px 12px; border-radius:99px; letter-spacing:.04em;}
  .note{font-size:12.5px; color:var(--soft); line-height:1.5; margin:0;}
  .chip{display:inline-block; background:var(--card2); border:1px solid var(--line); padding:4px 10px; border-radius:99px; font-size:12px;}
  .chip.red{background:var(--red2); border-color:var(--red);}
  .tag{display:inline-block; font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:5px; margin-left:4px; vertical-align:1px;}
  .tag.night{background:var(--red2); color:#fff;} .tag.sup{background:var(--warnbg); color:var(--warn);} .tag.inc{background:var(--okbg); color:var(--ok);} .tag.no{background:var(--card2); color:var(--soft); border:1px solid var(--line);}
  .stepper{display:flex; align-items:center; gap:10px;}
  .stepper button{width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:#fff; font-size:17px; cursor:pointer;}
  .stepper button.add{background:var(--red); border-color:var(--red);}
  .stepper button:disabled{opacity:.3; cursor:default;}
  .stepper b{min-width:16px; text-align:center;}
  .btn{border:none; background:var(--red); color:#fff; font-weight:700; padding:12px 14px; border-radius:12px; cursor:pointer; font-size:14px;}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--ink);}
  .btn.ok{background:var(--ok); color:#04220f;}
  .btn.sm{padding:7px 11px; font-size:12.5px; border-radius:9px;}
  .btn.full{width:100%;}
  .toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%); z-index:90; background:#fff; color:#000; font-weight:600; font-size:14px; padding:10px 16px; border-radius:12px; opacity:0; transition:opacity .25s; pointer-events:none; max-width:90vw; text-align:center;}
  .toast.show{opacity:1;}
  .hostline{font-size:12.5px; color:var(--soft); margin-top:8px; padding-top:8px; border-top:1px solid var(--line);}
  .linkbtn{background:none; border:none; color:var(--red); font-weight:700; font-size:12.5px; cursor:pointer; padding:0; text-decoration:underline;}
  .round.sugg{border-color:var(--warn);} .round.sugg .round-top b{color:var(--warn);}
  .round.friendban{border-color:var(--red);}
  .num.ph{width:58px; height:58px; border:none; padding:0; cursor:zoom-in; background-size:cover; background-position:center; position:relative; align-items:flex-end; justify-content:flex-start;}
  .num.ph span{background:rgba(0,0,0,.72); color:#fff; font-size:11px; padding:1px 5px; border-radius:0 6px 0 9px;}
  [hidden]{display:none!important;}

  /* ===== cliente ===== */
  .cli{max-width:460px; margin:0 auto; padding-bottom:110px;}
  .bufban{margin:6px 16px 10px; border-radius:18px; padding:16px; background:linear-gradient(135deg,var(--red),var(--red2)); display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .bufban small{font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.85;} .bufban h2{font-size:28px; line-height:1.05;} .bufban p{margin:4px 0 0; font-size:12.5px; opacity:.9;}
  .bufban button{flex:none; border:none; background:#fff; color:var(--red); font-weight:800; font-size:14px; padding:11px 14px; border-radius:12px; cursor:pointer;}
  .round{margin:6px 16px 10px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px;}
  .round-top{display:flex; justify-content:space-between; align-items:center; font-size:13.5px;} .round-top b{font-family:'Anton'; font-size:18px; font-weight:400;}
  .bar{height:8px; background:var(--card2); border-radius:99px; overflow:hidden; margin-top:8px;} .bar i{display:block; height:100%; background:var(--red); transition:width .25s;}
  .round small{color:var(--soft); font-size:12px; display:block; margin-top:6px;}
  .round .warnline{color:var(--warn); font-size:12px; margin-top:6px;}
  .cats{position:sticky; top:45px; z-index:30; display:flex; gap:6px; overflow-x:auto; padding:8px 16px; background:var(--bg); scrollbar-width:none;} .cats::-webkit-scrollbar{display:none;}
  .cats button{flex:none; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:99px; cursor:pointer;}
  .cats button.hl{background:var(--red); border-color:var(--red);}
  .sec{padding:14px 16px 4px;} .sec h2{font-size:24px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;} .sec h2 .chip{font-family:'Inter'; font-size:11px;}
  .dish{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin-top:8px;}
  .num{flex:none; width:38px; height:38px; border-radius:10px; background:var(--card2); display:flex; align-items:center; justify-content:center; font-family:'Anton'; font-size:13px; color:var(--soft);}
  .dish .info{flex:1; min-width:0;} .dish .info b{display:block; font-weight:600; font-size:14.5px;} .dish .info span{font-size:12px; color:var(--soft);}
  .dish.off{opacity:.38;}
  .cta{position:fixed; left:0; right:0; bottom:0; z-index:40; padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px)); background:linear-gradient(180deg,transparent,#000 35%);}
  .cta button{display:block; width:100%; max-width:428px; margin:0 auto;}
  .wait{margin:30px 16px; background:var(--card); border:1px dashed var(--red); border-radius:18px; padding:22px; text-align:center;}
  .wait .dot{width:10px; height:10px; border-radius:50%; background:var(--red); display:inline-block; animation:bl 1s infinite;} @keyframes bl{50%{opacity:.2}}
  .sheet{position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.72); display:flex; align-items:flex-end; justify-content:center;}
  .sheet.center{align-items:center; padding:18px;}
  .sheet .box{width:100%; max-width:460px; background:var(--card); border-radius:22px 22px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px)); max-height:88vh; overflow:auto; border-top:3px solid var(--red);}
  .sheet.center .box{border-radius:22px; border:2px solid var(--warn);}
  .counter{display:flex; align-items:center; justify-content:space-between; background:var(--card2); border-radius:14px; padding:10px 12px; margin-top:10px;}
  .counter span small{display:block; color:var(--soft); font-size:12px;}
  .rules{margin:12px 0 0; padding-left:18px; color:var(--soft); font-size:13px; line-height:1.6;}
  .line{display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:14px;} .line.total{font-weight:700; font-size:17px; border:none; padding-top:12px;}
  .x{border:none; background:var(--card2); color:#fff; width:34px; height:34px; border-radius:50%; font-size:15px; cursor:pointer;}
  .price-row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}

  /* ===== sala ===== */
  .sala{max-width:1180px; margin:0 auto; padding:14px 16px 40px;}
  .sala-top{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px;}
  .stabs{display:flex; gap:6px; flex-wrap:wrap;}
  .stabs button{border:1px solid var(--line); background:var(--card); color:var(--soft); font-weight:600; font-size:13px; padding:8px 14px; border-radius:10px; cursor:pointer;}
  .stabs button.on{background:var(--ink); color:#000;}
  .turnobox{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--soft);}
  .turnobox select{background:var(--card2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font:inherit;}
  .cols{display:grid; grid-template-columns:minmax(0,1fr); gap:16px;}
  @media (min-width:860px){ .cols{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);} }
  .col h2{font-size:22px; margin-bottom:8px; display:flex; align-items:center; gap:8px;}
  .col h2 .count{font-family:'Inter'; font-size:12px; background:var(--card2); padding:2px 8px; border-radius:99px; color:var(--soft);}
  .tcard{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px;}
  .tcard.new{border-color:var(--warn);} .tcard.bill{border-color:var(--red);}
  .thead{display:flex; justify-content:space-between; align-items:center; gap:8px;} .thead h3{font-size:20px;}
  .sub{color:var(--soft); font-size:12.5px; margin:2px 0 0;}
  .st{font-size:11px; font-weight:800; padding:3px 8px; border-radius:99px; white-space:nowrap;}
  .st.c{background:var(--warnbg); color:var(--warn);} .st.s{background:var(--okbg); color:var(--ok);} .st.r{background:var(--red2); color:#fff;}
  .group{margin-top:10px; border-radius:12px; background:var(--card2); padding:10px 12px;}
  .group-h{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:11.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; margin-bottom:6px;}
  .group-h.pend{color:var(--warn);} .group-h.done{color:var(--ok);}
  .it{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 0; border-top:1px solid var(--line); font-size:13.5px;}
  .group-h + .it{border-top:none;}
  .it .nm{min-width:0;} .it .nm b{color:var(--soft); font-weight:700; margin-right:3px;}
  .it .rd{font-size:11px; color:var(--soft); margin-left:6px;}
  .done-list{font-size:13px; color:var(--soft); line-height:1.7;}
  .row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center;}
  .stock{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px;}
  .stock input[type=search], .addf input, .addf select{width:100%; background:var(--card2); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit;}
  .srow{display:grid; grid-template-columns:44px minmax(0,1fr) 84px 96px; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--line); font-size:13.5px;}
  .srow.off .snm{text-decoration:line-through; color:var(--soft);}
  .srow input{width:100%; background:var(--card2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font:inherit; text-align:right;}
  .tog{border:none; border-radius:99px; padding:6px 10px; font-weight:700; font-size:12px; cursor:pointer;}
  .tog.on{background:var(--okbg); color:var(--ok);} .tog.off{background:var(--red2); color:#fff;}
  .scat{font-family:'Anton'; font-size:16px; margin:14px 0 2px; color:var(--soft); letter-spacing:.04em;}
  .addf{display:grid; grid-template-columns:minmax(0,1fr); gap:8px; margin-top:10px;}
  @media (min-width:640px){ .addf{grid-template-columns:2fr 1fr 1.4fr auto;} }
</style>
</head>
<body>
<div class="switch">
  <span class="demo">DEMO SÍRVELO · PROPUESTA NO OFICIAL</span>
  <button id="swCli" class="on">📱 Quien pide</button>
  <button id="swFri">📱 Amigo</button>
  <button id="swSala">🧑‍🍳 Sala</button>
  <span class="turno" id="turnoTxt"></span>
</div>
<main id="vCli" class="cli"></main>
<main id="vFri" class="cli" hidden></main>
<main id="vSala" class="sala" hidden></main>
<div class="cta" id="cta" hidden><button class="btn full" id="ctaBtn"></button></div>
<div id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  /* ===== carta (extracto real de la carta de Sushi Ya El Masnou, sushiya.es) =====
     n: número de carta · p: precio a la carta · night: solo menú de noche · buf: ración en buffet · sup: suplemento en buffet */
  const MENU = [
    { cat:"Entrantes", items:[
      {n:"1",t:"Sopa de miso",p:3.95},{n:"2",t:"Sopa de marisco",p:5.95,night:1},{n:"2A",t:"Poke vegetal",p:6.50},
      {n:"3",t:"Poke de atún",p:9.95,night:1},{n:"4",t:"Poke de salmón",p:8.95},{n:"5",t:"Ensalada de cangrejo",p:5.95},
      {n:"6",t:"Edamame",p:5.95},{n:"6A",t:"Edamame peperoncino",p:7.95,night:1},{n:"7",t:"Ensalada wakame",p:5.50},{n:"8",t:"Tofu con salsa de la casa",p:5.50}]},
    { cat:"Arroz y pasta", items:[
      {n:"9",t:"Yakimeshi unagi",p:11.95,night:1,sup:2},{n:"10",t:"Yakimeshi ebi",p:7.95},{n:"11",t:"Yakimeshi pollo",p:7.50},
      {n:"12",t:"Yakisoba de pollo",p:7.95},{n:"13",t:"Arroz blanco",p:3.95},{n:"14",t:"Yakisoba ebi",p:8.95},{n:"19",t:"Ramen miso",p:10.95}]},
    { cat:"Dim sum", items:[
      {n:"21",t:"Gyozas de cerdo",p:6.95,buf:"4 u."},{n:"22",t:"Gyozas de pollo y verduras",p:6.95,buf:"4 u."},{n:"23",t:"Gyozas de ebi",p:7.50,night:1},
      {n:"24",t:"Gyoza vegetal",p:6.50,buf:"4 u."},{n:"25",t:"Sau mai",p:4.95,buf:"3 u."},{n:"29",t:"Bao dulce de crema",p:4.50,buf:"1 u."}]},
    { cat:"Fritos", items:[
      {n:"30",t:"Bola de sésamo",p:5.95,night:1,buf:"3 u."},{n:"31",t:"Rollitos de gamba",p:6.50,buf:"3 u."},{n:"32",t:"Langostino tempura",p:8.95},
      {n:"33",t:"Verduras tempura",p:7.95},{n:"36",t:"Saquitos de la suerte",p:5.50,buf:"3 u."}]},
    { cat:"Teppanyaki", items:[
      {n:"44",t:"Brochetas de ternera (2 u.)",p:6.95},{n:"45",t:"Brochetas de salmón (2 u.)",p:6.95,night:1},{n:"46",t:"Brochetas de gamba (2 u.)",p:5.95},
      {n:"50",t:"Brochetas yakitori (2 u.)",p:6.50},{n:"51",t:"Vieira (1 ración por persona)",p:7.95,night:1}]},
    { cat:"Uramakis", items:[
      {n:"82",t:"Chip roll",p:9.95,buf:"4 u."},{n:"84",t:"Deluxe roll",p:14.95,night:1,sup:2,buf:"4 u."},{n:"85",t:"Cream roll",p:9.95,night:1,buf:"4 u."},
      {n:"86",t:"Unagi roll",p:12.95,night:1,buf:"4 u."},{n:"87",t:"Mango roll",p:9.50,buf:"4 u."},{n:"135",t:"Spicy roll de salmón",p:9.95,buf:"4 u."},{n:"137",t:"Rainbow tuna",p:14.95,night:1,buf:"4 u."}]},
    { cat:"Nigiri", items:[
      {n:"95",t:"Nigiri de salmón (2 u.)",p:4.50},{n:"96",t:"Nigiri de atún (2 u.)",p:5.95,night:1},{n:"97",t:"Nigiri unagi (2 u.)",p:5.50,night:1},
      {n:"98",t:"Nigiri ebi (2 u.)",p:4.50},{n:"100",t:"Nigiri de salmón flameado (2 u.)",p:4.95},{n:"103",t:"Nigiri de dorada (2 u.)",p:4.50}]},
    { cat:"Hosomaki", items:[
      {n:"68",t:"Maki salmón (6 u.)",p:5.95},{n:"69",t:"Maki atún (6 u.)",p:6.50},{n:"71",t:"Maki aguacate (6 u.)",p:4.95},
      {n:"72",t:"Maki pepino (6 u.)",p:4.50},{n:"131",t:"Maki queso philadelphia (6 u.)",p:4.50}]},
    { cat:"Especiales de la casa", items:[
      {n:"169",t:"Yuzu tuna tartar (1 por persona)",p:9.95,night:1},{n:"171",t:"Uramaki de salmón frito",p:10.95},{n:"740",t:"Sato maki",p:12.95,night:1},{n:"810",t:"Cheesy roll",p:10.95}]},
    { cat:"Postres", extra:1, items:[
      {n:"P1",t:"Mochi tiramisú",p:5.50},{n:"P2",t:"Mochi té matcha",p:5.50},{n:"P3",t:"Mochi cheesecake",p:5.50},{n:"P4",t:"Mochi oreo",p:5.50},
      {n:"P5",t:"Mochi chocolate",p:5.50},{n:"P6",t:"Mochi mango",p:5.50},{n:"P7",t:"Mochi triple chocolate",p:5.95},{n:"P8",t:"Dorayaki (chocolate o judía)",p:5.50},
      {n:"P9",t:"Trufa",p:5.95},{n:"P10",t:"Trufa de té matcha",p:5.95},{n:"P11",t:"Limón helado",p:6.95}]},
    { cat:"Bebidas", extra:1, items:[
      {n:"B1",t:"Cerveza Kirin",p:3.60},{n:"B2",t:"Cerveza Asahi",p:3.60},{n:"B3",t:"Refresco",p:3.30},{n:"B4",t:"Agua mineral 50 cl",p:3.00},
      {n:"B5",t:"Jarrita de sake",p:6.95},{n:"B6",t:"Sangría de cava",p:18.95},{n:"B7",t:"Té matcha",p:3.50},{n:"B8",t:"Café solo",p:1.90}]}

  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const toast = m => { const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2400); };
  const isBuf = t => t.mode === "buffet";
  const inBuffet = (t, it) => isBuf(t) && !it.extra;               // bebidas y postres nunca entran en el buffet
  const available = it => it.on && !(it.night && turno()==="mediodia");
  const persons = t => (t.adults||0) + (t.kids||0);
  const cartCount = (t, food) => Object.entries(t.cart).reduce((a,[n,q]) => a + (food===undefined || (!byN(n).extra)===food ? q : 0), 0);
  const pendingOf = o => o.items.reduce((a,i)=>a+(i.q-(i.s||0)),0);
  const blockedRound = t => isBuf(t) && t.orders.some(o => o.buffet && pendingOf(o) > 0);
  const kidsTxt = k => k===1 ? "niño" : "niños";
  const peopleTxt = t => `${t.adults} adultos${t.kids?` + ${t.kids} ${kidsTxt(t.kids)}`:""}`;

  /* ================= CLIENTE ================= */
  function renderCli(){
    const v=$("vCli"), t=me;
    const header = `<header class="brand"><div class="logo"><div class="ring"></div><div><b>SUSHI YA</b><small>EL MASNOU</small></div></div><span class="pill">MESA 5</span></header>`;
    if (t.step==="espera"){
      v.innerHTML = header + `<div class="wait"><span class="dot"></span><h2 style="margin-top:10px">ESPERANDO AL CAMARERO</h2>
        <p class="note" style="margin-top:8px">Va a confirmar que sois <b>${peopleTxt(t)}</b> en buffet libre. Pedirá <b>${esc(t.host)}</b>. Es un momento.</p>
        <p class="note" style="margin-top:14px">👉 En la demo, pulsa arriba <b>“Sala”</b> y confirma el buffet.</p></div>`;
      cta(null); return;
    }
    const food = cartCount(t,true), blocked = blockedRound(t);
    const nRounds = t.orders.filter(o=>o.buffet).length;
    const top = isBuf(t)
      ? `<div class="round"><div class="round-top"><b>${blocked?`RONDA ${nRounds} EN COCINA`:`RONDA ${nRounds+1}`}</b><span>${blocked?"Esperando platos…":`${food}/${ROUND_MAX} platos`}</span></div>
          <div class="bar"><i style="width:${blocked?100:Math.min(100,food/ROUND_MAX*100)}%"></i></div>
          <small>${blocked?"Cuando os sirvan esta ronda podréis pedir la siguiente.":`Buffet libre · ${peopleTxt(t)} · bebidas y postres aparte`}</small>
          <div class="warnline">⚠ Cada plato no consumido se cobra ${PENALTY} €</div>
          <div class="hostline">👑 Pides tú, <b>${esc(t.host)}</b>. Tus amigos ven la carta y te dicen qué quieren.</div></div>
          ${t.sugg.length?`<div class="round sugg"><div class="round-top"><b>TE PIDEN</b><span>${t.sugg.length}</span></div>
            ${t.sugg.map((g,i)=>`<div class="it"><span class="nm"><b>${esc(g.from)}</b> quiere ${g.q} × ${esc(byN(g.n).t)}</span><span class="row" style="margin:0"><button class="btn ok sm" data-sadd="${i}">Añadir</button><button class="btn ghost sm" data-sno="${i}">No</button></span></div>`).join("")}</div>`:""}`
      : `<div class="bufban" id="bufban"><div><small>¿Mucha hambre?</small><h2>BUFFET LIBRE</h2><p>Todo lo que queráis desde este móvil · ${fmt(PRICE[turno()])} adulto · ${fmt(PRICE.nino)} niño</p></div><button id="startBuf">Iniciar buffet</button></div>`;
    v.innerHTML = header + top +
      `<nav class="cats">${!isBuf(t)?'<button data-go="bufban" class="hl">🍣 Buffet</button>':""}${MENU.map((c,i)=>`<button data-go="s${i}">${c.cat}</button>`).join("")}</nav>
      ${MENU.map((c,i)=>`<section class="sec" id="s${i}"><h2>${c.cat.toUpperCase()} ${c.extra&&isBuf(t)?'<span class="chip">No incluido en el buffet</span>':''}</h2>
        ${c.items.map(it=>dishHtml(t,it)).join("")}</section>`).join("")}
      <p class="note" style="padding:14px 16px">Menú de ${turno()==="noche"?"noche":"mediodía"} · carta de ejemplo con platos reales de Sushi Ya El Masnou. Si tienes alguna alergia, avisa al personal.</p>`;
    const sb=$("startBuf"); if (sb) sb.onclick=openBuffet;
    const n = cartCount(t);
    if (t.bill) cta("Cuenta pedida · el camarero viene", null, true);
    else if (n>0) cta(isBuf(t)?`Enviar a cocina · ${n} ${n===1?"plato":"platos"}`:`Enviar pedido · ${fmt(cartTotal(t))}`, sendOrder);
    else cta("Pedir la cuenta", openBill);
  }
  function renderFri(){
    const v=$("vFri"), t=me;
    const header = `<header class="brand"><div class="logo"><div class="ring"></div><div><b>SUSHI YA</b><small>EL MASNOU</small></div></div><span class="pill">MESA 5</span></header>`;
    const active = isBuf(t) && t.step==="carta";
    const top = active
      ? `<div class="round friendban"><div class="round-top"><b>BUFFET LIBRE · MESA 5</b><span>${peopleTxt(t)}</span></div>
          <small>Está pidiendo <b style="color:var(--ink)">${esc(t.host)}</b>. Mira la carta y dile lo que quieres, o pulsa <b style="color:var(--ink)">«Pedírselo»</b> y le llegará a su móvil.</small>
          <div class="hostline">Tú eres <b>${esc(friend)}</b> · <button class="linkbtn" data-me>cambiar nombre</button></div></div>`
      : `<div class="round"><div class="round-top"><b>${t.step==="espera"?"EMPEZANDO EL BUFFET…":"CARTA"}</b></div>
          <small>${t.step==="espera"?`${esc(t.host)} está iniciando el buffet de la mesa. En cuanto el camarero lo confirme, lo verás aquí.`:"Aquí puedes ver la carta. Si vais a hacer buffet, que lo inicie una persona desde su móvil."}</small></div>`;
    const sent = new Set(t.sugg.filter(g=>g.from===friend).map(g=>g.n));
    v.innerHTML = header + top +
      `<nav class="cats">${MENU.map((c,i)=>`<button data-go="f${i}">${c.cat}</button>`).join("")}</nav>
      ${MENU.map((c,i)=>`<section class="sec" id="f${i}"><h2>${c.cat.toUpperCase()} ${c.extra&&active?'<span class="chip">No incluido en el buffet</span>':''}</h2>
        ${c.items.map(it=>{ const ok=available(it), inc=active&&!it.extra;
          const sub=!it.on?"Agotado hoy":inc?`<span class="tag inc" style="margin:0">INCLUIDO</span>${it.buf?` · en buffet ${it.buf}`:""}`:`${fmt(it.p)}${active&&it.extra?' <span class="tag no">NO INCLUIDO</span>':""}`;
          const right=!ok?`<span class="note" style="font-size:12px">${!it.on?"Agotado":"Solo noche"}</span>`
            : active ? (sent.has(it.n)?'<span class="tag inc">Enviado ✓</span>':`<button class="btn ghost sm" data-sug="${it.n}">Pedírselo</button>`) : "";
          return `<div class="dish ${ok?"":"off"}">${numBox(it)}<div class="info"><b>${esc(it.t)}${it.night?'<span class="tag night">NOCHE</span>':""}</b><span>${sub}</span></div>${right}</div>`; }).join("")}</section>`).join("")}`;
  }
  const numBox = it => PHOTOS[it.n] ? `<button class="num ph" data-ph="${it.n}" style="background-image:url(${PHOTOS[it.n]})" aria-label="Ver foto de ${esc(it.t)}"><span>${it.n}</span></button>` : `<div class="num">${it.n}</div>`;
  function dishHtml(t, it){
    const q=t.cart[it.n]||0, ok=available(it), inc=inBuffet(t,it);
    const lock = inc && blockedRound(t);
    const tags = (it.night?'<span class="tag night">NOCHE</span>':'') + (inc&&it.sup?`<span class="tag sup">+${it.sup} €</span>`:'');
    const sub = !it.on ? "Agotado hoy" : inc ? `<span class="tag inc" style="margin:0">INCLUIDO</span>${it.buf?` · en buffet ${it.buf}`:""}`
              : `${fmt(it.p)}${isBuf(t)&&it.extra?' <span class="tag no">NO INCLUIDO</span>':""}`;
    const right = !ok ? `<span class="note" style="font-size:12px">${!it.on?"Agotado":"Solo noche"}</span>`
      : `<div class="stepper">${q?`<button data-d="${it.n}">–</button><b>${q}</b>`:""}<button class="add" data-i="${it.n}" ${lock?"disabled":""}>+</button></div>`;
    return `<div class="dish ${ok?"":"off"}">${numBox(it)}<div class="info"><b>${esc(it.t)}${tags}</b><span>${sub}</span></div>${right}</div>`;
  }
  function cartTotal(t){ return Object.entries(t.cart).reduce((a,[n,q])=>{ const it=byN(n); return a + q*(inBuffet(t,it)?(it.sup||0):it.p); },0); }
  function add(n){
    const t=me, it=byN(n);
    if (inBuffet(t,it)){
      if (blockedRound(t)) return toast("Espera a que os sirvan la ronda anterior 🍣");
      if (cartCount(t,true) >= ROUND_MAX) return toast(`Máximo ${ROUND_MAX} platos por ronda`);
    }
    t.cart[n]=(t.cart[n]||0)+1; render();
  }
  function sendOrder(){
    const t=me, items=Object.entries(t.cart).map(([n,q])=>({n,q,s:0}));
    if (isBuf(t)){
      const food = items.filter(i=>!byN(i.n).extra), extra = items.filter(i=>byN(i.n).extra);
      if (food.length) t.orders.push({ at:hhmm(), buffet:1, items:food });
      if (extra.length) t.orders.push({ at:hhmm(), status:"cocina", items:extra });
    } else {
      t.orders.push({ at:hhmm(), status:"cocina", items });
    }
    t.cart={}; render(); toast("¡Enviado a cocina! 🔥"); window.scrollTo({top:0,behavior:"smooth"});
  }
  function billLines(t){
    const L=[];
    if (isBuf(t)){
      if (t.adults) L.push([`Buffet adulto (${turno()==="noche"?"noche":"mediodía"}) × ${t.adults}`, t.adults*PRICE[turno()]]);
      if (t.kids) L.push([`Buffet infantil × ${t.kids}`, t.kids*PRICE.nino]);
      t.orders.forEach(o=>o.items.forEach(i=>{ const it=byN(i.n);
        if (o.buffet){ if (it.sup && i.q) L.push([`${i.q} × ${it.t} (suplemento)`, i.q*it.sup]); }
        else L.push([`${i.q} × ${it.t}`, i.q*it.p]);
      }));
    } else {
      t.orders.forEach(o=>o.items.forEach(i=>{ const it=byN(i.n); L.push([`${i.q} × ${it.t}`, i.q*it.p]); }));
    }
    if (t.penalties) L.push([`Platos no consumidos × ${t.penalties}`, t.penalties*PENALTY]);
    return L;
  }
  const billTotal = t => billLines(t).reduce((a,l)=>a+l[1],0);
  function openBill(){
    const t=me, L=billLines(t);
    $("sheet").innerHTML=`<div class="sheet"><div class="box"><h2 style="font-size:24px">LA CUENTA · MESA 5</h2>
      ${L.map(l=>`<div class="line"><span>${esc(l[0])}</span><span>${fmt(l[1])}</span></div>`).join("")||'<p class="note">Aún no hay nada.</p>'}
      <div class="line total"><span>Total</span><span>${fmt(billTotal(t))}</span></div>
      <p class="note">La cuenta de grupo no se cobra por separado.</p>
      <button class="btn full" id="bY" style="margin-top:12px">Sí, pedir la cuenta</button><button class="btn ghost full" id="bN" style="margin-top:8px">Todavía no</button></div></div>`;
    $("bN").onclick=()=>$("sheet").innerHTML="";
    $("bY").onclick=()=>{ t.bill=true; $("sheet").innerHTML=""; render(); toast("Cuenta pedida. ¡Gracias! 🙏"); };
  }
  function openBuffet(){
    if (me.orders.length) return toast("Ya habéis pedido a la carta: pedid al camarero el cambio a buffet");
    bufOpen=true; bufSheet();
  }
  function bufSheet(){
    if (!bufOpen) return;
    const t=me, pb=PRICE[turno()];
    $("sheet").innerHTML=`<div class="sheet" id="bufS"><div class="box">
      <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:28px">BUFFET LIBRE</h2><button class="x" id="bufX" aria-label="Cerrar">✕</button></div>
      <p class="note" style="margin-top:4px">Pedid todo lo que queráis desde este móvil, por rondas de hasta ${ROUND_MAX} platos.</p>
      <div class="price-row"><span class="chip red">${fmt(pb)} / adulto</span><span class="chip">${fmt(PRICE.nino)} / niño (110-140 cm)</span><span class="chip">${turno()==="noche"?"Menú de noche":"Menú de mediodía"}</span></div>
      <div class="counter"><span>Adultos</span><div class="stepper"><button data-c="adults:-1">–</button><b>${t.adults}</b><button class="add" data-c="adults:1">+</button></div></div>
      <div class="counter"><span>Niños<small>De 110 a 140 cm</small></span><div class="stepper"><button data-c="kids:-1">–</button><b>${t.kids}</b><button class="add" data-c="kids:1">+</button></div></div>
      <div class="counter" style="display:block"><span>¿Quién va a pedir?<small>Solo esta persona podrá enviar pedidos. Los demás podrán ver la carta desde su móvil.</small></span>
        <input id="hostName" placeholder="Tu nombre" value="${esc(hostDraft)}" autocomplete="off" style="margin-top:8px;width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit"></div>
      <ul class="rules"><li>Toda la mesa tiene que ser buffet.</li><li><b style="color:var(--ink)">Bebidas y postres no incluidos</b> (al menos 1 bebida por persona).</li>
        <li>Máximo ${ROUND_MAX} platos por ronda; la siguiente, cuando os sirvan.</li><li>Cada plato no consumido: ${PENALTY} €.</li></ul>
      <div class="line total"><span>${peopleTxt(t)}</span><span>${fmt(t.adults*pb+t.kids*PRICE.nino)}</span></div>
      <button class="btn full" id="bufGo" style="margin-top:8px">Iniciar buffet · ${persons(t)} personas</button></div></div>`;
    const close=()=>{ bufOpen=false; $("sheet").innerHTML=""; };
    $("bufX").onclick=close; $("bufS").onclick=e=>{ if(e.target.id==="bufS") close(); };
    const hn=$("hostName"); hn.oninput=()=>{ hostDraft=hn.value; };
    $("bufGo").onclick=()=>{ const name=hostDraft.trim(); if (!name){ toast("Pon tu nombre para poder pedir"); hn.focus(); return; }
      close(); t.host=name; t.sugg=[]; t.mode="buffet"; t.step="espera"; t.cart={}; t.warned=false; render(); window.scrollTo(0,0); toast("Avisando al camarero…"); };
  }
  // Aviso obligatorio al entrar al buffet (una sola vez, al confirmar el camarero)
  function warnSheet(){
    if (view!=="cli" || !isBuf(me) || me.step!=="carta" || me.warned) return;
    $("sheet").innerHTML=`<div class="sheet center"><div class="box" style="text-align:center">
      <div style="font-size:40px">⚠️</div><h2 style="font-size:26px;margin-top:4px">ANTES DE EMPEZAR</h2>
      <p style="font-size:16px;line-height:1.5;margin:12px 0 6px">Cada plato que <b>no os terminéis</b> se cobra <b style="color:var(--warn)">${PENALTY} €</b>.</p>
      <p class="note">Pedid solo lo que vayáis a comer: siempre podéis pedir otra ronda. Las <b>bebidas y los postres no están incluidos</b>.</p>
      <button class="btn full" id="wOk" style="margin-top:14px">Entendido, ¡a comer!</button></div></div>`;
    $("wOk").onclick=()=>{ me.warned=true; $("sheet").innerHTML=""; };
  }
  function cta(label, fn, disabled){
    const c=$("cta"), b=$("ctaBtn");
    if (!label || view!=="cli"){ c.hidden=true; return; }
    c.hidden=false; b.textContent=label; b.disabled=!!disabled; b.style.opacity=disabled?.6:1; b.onclick=fn||null;
  }

  /* ================= SALA ================= */
  function renderSala(){
    const v=$("vSala"), tables=Object.values(T);
    const carta = tables.filter(t=>!isBuf(t) || t.step==="espera");
    const bufs = tables.filter(t=>isBuf(t) && t.step==="carta");
    v.innerHTML = `
      <div class="sala-top">
        <div class="stabs"><button data-st="mesas" class="${salaTab==="mesas"?"on":""}">Mesas y buffets</button><button data-st="carta" class="${salaTab==="carta"?"on":""}">Carta y disponibilidad</button></div>
        <label class="turnobox">Menú:
          <select id="turnoSel"><option value="auto" ${turnoMode==="auto"?"selected":""}>Automático (ahora: ${autoTurno()==="noche"?"noche":"mediodía"})</option>
            <option value="mediodia" ${turnoMode==="mediodia"?"selected":""}>Forzar mediodía</option><option value="noche" ${turnoMode==="noche"?"selected":""}>Forzar noche (festivo)</option></select></label>
      </div>
      ${salaTab==="mesas" ? `<div class="cols">
        <section class="col"><h2>A LA CARTA <span class="count">${carta.length}</span></h2>${carta.map(cartaCard).join("")||'<p class="note">Sin mesas a la carta.</p>'}</section>
        <section class="col"><h2>BUFFETS <span class="count">${bufs.length}</span></h2>${bufs.map(bufCard).join("")||'<p class="note">Ninguna mesa en buffet ahora mismo.</p>'}</section>
      </div>` : stockHtml()}`;
    bindSala();
  }
  function cartaCard(t){
    if (t.step==="espera") return `<div class="tcard new"><div class="thead"><h3>MESA ${t.id}</h3><span class="st c">QUIERE BUFFET</span></div>
      <p style="margin:8px 0 0">Buffet libre: <b>${peopleTxt(t)}</b> · pide <b>${esc(t.host||"—")}</b></p>
      <p class="sub">Comprueba en la mesa que son los que dicen.</p>
      <div class="row"><button class="btn" data-conf="${t.id}">Confirmar buffet</button><button class="btn ghost" data-reject="${t.id}">Rechazar</button></div></div>`;
    return `<div class="tcard ${t.bill?"bill":""}"><div class="thead"><h3>MESA ${t.id}</h3>${t.bill?'<span class="st r">PIDE LA CUENTA</span>':""}</div>
      ${t.orders.length?t.orders.map((o,i)=>`<div class="group"><div class="group-h ${o.status==="servido"?"done":"pend"}"><span>Pedido ${i+1} · ${o.at}</span>
        <span class="row" style="margin:0">${o.status==="servido"?'<span class="st s">SERVIDO</span>':`<button class="btn ok sm" data-done="${t.id}:${i}">Marcar servido</button>`}<button class="btn ghost sm" data-cancel="${t.id}:${i}">Cancelar</button></span></div>
        ${o.items.map(it=>`<div class="it"><span class="nm"><b>${it.q}×</b> ${esc(byN(it.n).t)}</span><span>${fmt(it.q*byN(it.n).p)}</span></div>`).join("")}</div>`).join("")
        :'<p class="sub" style="margin-top:6px">Todavía no han pedido.</p>'}
      <div class="line total"><span>Cuenta</span><span>${fmt(billTotal(t))}</span></div>
      <div class="row"><button class="btn ghost sm" data-close="${t.id}">Cerrar / eliminar mesa</button></div></div>`;
  }
  function bufCard(t){
    const bo=t.orders.filter(o=>o.buffet);
    const pend=[], done={};
    bo.forEach((o,ri)=>o.items.forEach((it,ii)=>{
      const left=it.q-(it.s||0); if (left>0) pend.push({ri,ii,n:it.n,q:left,round:ri+1});
      if (it.s) done[it.n]=(done[it.n]||0)+it.s;
    }));
    const nPend=pend.reduce((a,p)=>a+p.q,0), nDone=Object.values(done).reduce((a,b)=>a+b,0);
    const extraOrders=t.orders.filter(o=>!o.buffet);
    return `<div class="tcard ${t.bill?"bill":""}"><div class="thead"><h3>BUFFET · MESA ${t.id}</h3>${t.bill?'<span class="st r">PIDE LA CUENTA</span>':nPend?`<span class="st c">${nPend} POR SERVIR</span>`:'<span class="st s">AL DÍA</span>'}</div>
      <p class="sub">${peopleTxt(t)} · menú de ${turno()==="noche"?"noche":"mediodía"} · ${bo.length} ${bo.length===1?"ronda":"rondas"}</p>
      <div class="row" style="margin-top:6px"><span class="chip">👑 Pide: <b>${esc(t.host||"—")}</b></span><button class="btn ghost sm" data-host="${t.id}">Cambiar quién pide</button></div>
      <div class="group"><div class="group-h pend"><span>⏳ Por servir (${nPend})</span>${nPend?`<button class="btn ok sm" data-servall="${t.id}">Servir todo</button>`:""}</div>
        ${pend.map(p=>`<div class="it"><span class="nm"><b>${p.q}×</b> <b>${p.n}</b> ${esc(byN(p.n).t)}<span class="rd">ronda ${p.round}</span></span><span class="row" style="margin:0"><button class="btn ok sm" data-serve="${t.id}:${p.ri}:${p.ii}">Servido</button><button class="btn ghost sm" data-rm="${t.id}:${p.ri}:${p.ii}" title="Quitar un plato">Quitar</button></span></div>`).join("")||'<p class="sub">Nada pendiente: la mesa puede pedir otra ronda.</p>'}</div>
      <div class="group"><div class="group-h done"><span>✓ Servidos (${nDone})</span></div>
        <div class="done-list">${Object.entries(done).map(([n,q])=>`${q}× ${esc(byN(n).t)}`).join(" · ")||"—"}</div></div>
      ${extraOrders.length?`<div class="group"><div class="group-h"><span>🍺 Bebidas y postres (se cobran aparte)</span></div>
        ${extraOrders.map(o=>{ const oi=t.orders.indexOf(o); return o.items.map(it=>`<div class="it"><span class="nm"><b>${it.q}×</b> ${esc(byN(it.n).t)}</span><span>${fmt(it.q*byN(it.n).p)}</span></div>`).join("")+`<div class="row" style="margin:4px 0 6px;justify-content:flex-end">${o.status==="servido"?'<span class="st s">SERVIDO</span>':`<button class="btn ok sm" data-done="${t.id}:${oi}">Marcar servido</button>`}<button class="btn ghost sm" data-cancel="${t.id}:${oi}">Cancelar</button></div>`; }).join("")}</div>`:""}
      <div class="row"><button class="btn ghost sm" data-pen="${t.id}">+ Plato no consumido (${PENALTY} €)</button>${t.penalties?`<button class="btn ghost sm" data-unpen="${t.id}">− Quitar penalización</button>`:""}${t.penalties?`<span class="sub">${t.penalties} ${t.penalties>1?"platos penalizados":"plato penalizado"}</span>`:""}</div>
      <div class="line total"><span>Cuenta</span><span>${fmt(billTotal(t))}</span></div>
      <div class="row"><button class="btn ghost sm" data-close="${t.id}">Cerrar / eliminar mesa</button></div></div>`;
  }
  function stockHtml(){
    const q=search.toLowerCase();
    return `<div class="stock">
      <h2 style="font-size:22px">CARTA Y DISPONIBILIDAD</h2>
      <p class="note" style="margin-top:4px">Apaga un plato cuando se acabe y desaparece al instante de todos los móviles. También puedes cambiar precios y añadir platos.</p>
      <input type="search" id="sq" placeholder="Buscar plato o número…" value="${esc(search)}" style="margin-top:10px">
      ${MENU.map(c=>{ const its=c.items.filter(i=>!q || i.t.toLowerCase().includes(q) || i.n.toLowerCase()===q); if(!its.length) return "";
        return `<div class="scat">${c.cat.toUpperCase()}</div>`+its.map(i=>`<div class="srow ${i.on?"":"off"}"><span class="num" style="width:40px;height:30px">${i.n}</span>
          <span class="snm">${esc(i.t)}${i.night?' <span class="tag night">NOCHE</span>':""}</span>
          <input type="number" step="0.05" min="0" value="${i.p.toFixed(2)}" data-price="${i.n}" aria-label="Precio de ${esc(i.t)}">
          <button class="tog ${i.on?"on":"off"}" data-tog="${i.n}">${i.on?"Disponible":"Agotado"}</button></div>`).join(""); }).join("")}
      <h3 style="font-size:18px;margin-top:18px">AÑADIR PLATO</h3>
      <div class="addf"><input id="aN" placeholder="Nombre del plato"><input id="aP" type="number" step="0.05" placeholder="Precio €">
        <select id="aC">${MENU.map((c,i)=>`<option value="${i}">${c.cat}</option>`).join("")}</select><button class="btn" id="aGo">Añadir</button></div>
    </div>`;
  }
  function ask(title, text, okLabel, fn){
    $("sheet").innerHTML=`<div class="sheet center" id="askS"><div class="box" style="text-align:center;border-color:var(--red)">
      <h2 style="font-size:24px">${title}</h2><p class="note" style="font-size:14px;margin:10px 0 16px">${text}</p>
      <button class="btn full" id="askOk">${okLabel}</button><button class="btn ghost full" id="askNo" style="margin-top:8px">No, volver</button></div></div>`;
    const close=()=>$("sheet").innerHTML="";
    $("askNo").onclick=close; $("askS").onclick=e=>{ if(e.target.id==="askS") close(); };
    $("askOk").onclick=()=>{ close(); fn(); };
  }
  function askName(title, text, current, fn){
    $("sheet").innerHTML=`<div class="sheet center" id="nmS"><div class="box" style="text-align:center;border-color:var(--red)">
      <h2 style="font-size:24px">${title}</h2><p class="note" style="font-size:14px;margin:10px 0 12px">${text}</p>
      <input id="nmIn" value="${esc(current||"")}" placeholder="Nombre" autocomplete="off" style="width:100%;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;text-align:center">
      <button class="btn full" id="nmOk" style="margin-top:12px">Guardar</button><button class="btn ghost full" id="nmNo" style="margin-top:8px">Cancelar</button></div></div>`;
    const close=()=>$("sheet").innerHTML=""; const inp=$("nmIn"); setTimeout(()=>inp.focus(),50);
    $("nmNo").onclick=close; $("nmS").onclick=e=>{ if(e.target.id==="nmS") close(); };
    $("nmOk").onclick=()=>{ const v=inp.value.trim(); if(!v) return toast("Escribe un nombre"); close(); fn(v); };
  }
  const fresh5 = () => ({ id:5, mode:"carta", step:"carta", adults:4, kids:1, cart:{}, orders:[], extras:[], penalties:0, bill:false, warned:false, host:"", sugg:[] });
  function bindSala(){
    const v=$("vSala");
    v.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{ salaTab=b.dataset.st; renderSala(); });
    $("turnoSel").onchange=e=>{ turnoMode=e.target.value; render(); toast(`Menú de ${turno()==="noche"?"noche":"mediodía"} activo`); };
    v.querySelectorAll("[data-conf]").forEach(b=>b.onclick=()=>{ const t=T[b.dataset.conf]; t.step="carta"; render(); toast(`Buffet de la mesa ${t.id} confirmado ✓`); });
    v.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{ const [id,i]=b.dataset.done.split(":"); T[id].orders[i].status="servido"; render(); });
    v.querySelectorAll("[data-serve]").forEach(b=>b.onclick=()=>{ const [id,ri,ii]=b.dataset.serve.split(":").map(Number); const it=T[id].orders.filter(o=>o.buffet)[ri].items[ii]; it.s=Math.min(it.q,(it.s||0)+1); render(); });
    v.querySelectorAll("[data-servall]").forEach(b=>b.onclick=()=>{ T[b.dataset.servall].orders.forEach(o=>{ if(o.buffet) o.items.forEach(i=>i.s=i.q); }); render(); toast("Todo servido: la mesa ya puede pedir otra ronda"); });
    v.querySelectorAll("[data-host]").forEach(b=>b.onclick=()=>{ const t=T[b.dataset.host];
      askName(`QUIÉN PIDE · MESA ${t.id}`, "Si a quien pedía se le ha acabado la batería o se ha ido, pon aquí quién pide ahora.", t.host, v=>{ t.host=v; render(); toast(`Ahora pide ${v}`); }); });
    v.querySelectorAll("[data-reject]").forEach(b=>b.onclick=()=>{ const t=T[b.dataset.reject];
      ask(`RECHAZAR BUFFET · MESA ${t.id}`, "La mesa vuelve a la carta normal y el cliente puede pedir de nuevo.", "Sí, rechazar", ()=>{ t.mode="carta"; t.step="carta"; render(); toast(`Mesa ${t.id}: buffet rechazado`); }); });
    v.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>{ const [id,i]=b.dataset.cancel.split(":").map(Number); const t=T[id], o=t.orders[i];
      ask(`CANCELAR PEDIDO · MESA ${id}`, `Se quitan ${o.items.reduce((a,x)=>a+x.q,0)} productos y se descuentan de la cuenta.`, "Sí, cancelar pedido", ()=>{ t.orders.splice(i,1); render(); toast("Pedido cancelado"); }); });
    v.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ const [id,ri,ii]=b.dataset.rm.split(":").map(Number); const t=T[id], bo=t.orders.filter(o=>o.buffet), o=bo[ri], it=o.items[ii];
      ask("QUITAR PLATO", `Se quita 1 × ${esc(byN(it.n).t)} de la ronda ${ri+1}.`, "Sí, quitar", ()=>{ it.q--; if (it.q<=0) o.items.splice(ii,1); if (!o.items.length) t.orders.splice(t.orders.indexOf(o),1); render(); toast("Plato quitado"); }); });
    v.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{ const id=+b.dataset.close;
      ask(`CERRAR MESA ${id}`, "Se borran sus pedidos y la mesa queda libre para los siguientes clientes. Hazlo cuando ya hayan pagado.", "Sí, cerrar mesa", ()=>{ if (id===5){ Object.assign(T[5], fresh5()); } else delete T[id]; render(); toast(`Mesa ${id} cerrada`); }); });
    v.querySelectorAll("[data-unpen]").forEach(b=>b.onclick=()=>{ const t=T[b.dataset.unpen]; if (t.penalties>0) t.penalties--; render(); toast("Penalización quitada"); });
    v.querySelectorAll("[data-pen]").forEach(b=>b.onclick=()=>{ T[b.dataset.pen].penalties++; render(); toast(`Penalización añadida (+${PENALTY} €)`); });
    v.querySelectorAll("[data-tog]").forEach(b=>b.onclick=()=>{ const it=byN(b.dataset.tog); it.on=!it.on; render(); toast(it.on?`${it.t}: disponible`:`${it.t}: agotado hoy`); });
    v.querySelectorAll("[data-price]").forEach(inp=>inp.onchange=()=>{ const it=byN(inp.dataset.price), p=parseFloat(inp.value); if(!isNaN(p)&&p>=0){ it.p=p; render(); toast(`Nuevo precio: ${it.t} ${fmt(p)}`); } });
    const sq=$("sq"); if(sq){ sq.oninput=()=>{ search=sq.value; const pos=sq.selectionStart; renderSala(); const n=$("sq"); n.focus(); n.setSelectionRange(pos,pos); }; }
    const aGo=$("aGo"); if(aGo) aGo.onclick=()=>{ const name=$("aN").value.trim(), p=parseFloat($("aP").value), c=MENU[+$("aC").value];
      if(!name||isNaN(p)) return toast("Pon nombre y precio");
      c.items.push({ n:"N"+(ALL().length+1), t:name, p, extra:!!c.extra, on:true }); render(); toast(`Añadido a ${c.cat}: ${name}`); };
  }

  /* ================= GENERAL ================= */
  function render(){
    $("turnoTxt").textContent = `Menú de ${turno()==="noche"?"noche":"mediodía"}${turnoMode==="auto"?" (automático)":""}`;
    renderCli(); renderFri(); renderSala(); bufSheet(); warnSheet();
    if (view!=="cli") $("cta").hidden=true;
  }
  function go(v){ view=v; $("swCli").classList.toggle("on",v==="cli"); $("swFri").classList.toggle("on",v==="fri"); $("swSala").classList.toggle("on",v==="sala"); $("vCli").hidden=v!=="cli"; $("vFri").hidden=v!=="fri"; $("vSala").hidden=v!=="sala";
    if (v!=="cli") { bufOpen=false; $("sheet").innerHTML=""; } render(); window.scrollTo(0,0); }
  $("swCli").onclick=()=>go("cli"); $("swFri").onclick=()=>go("fri"); $("swSala").onclick=()=>go("sala");
  document.addEventListener("click", e=>{
    const c=e.target.closest("[data-c]"); if(c){ const [k,d]=c.dataset.c.split(":"); me[k]=Math.max(k==="adults"?1:0, me[k]+ +d); render(); return; }
    const i=e.target.closest("[data-i]"); if(i){ add(i.dataset.i); return; }
    const d=e.target.closest("[data-d]"); if(d){ const n=d.dataset.d; me.cart[n]--; if(!me.cart[n]) delete me.cart[n]; render(); return; }
    const sg=e.target.closest("[data-sug]"); if(sg){ me.sugg.push({ from:friend, n:sg.dataset.sug, q:1 }); render(); toast(`Enviado a ${me.host}: ${byN(sg.dataset.sug).t}`); return; }
    const sa=e.target.closest("[data-sadd]"); if(sa){ const g=me.sugg[+sa.dataset.sadd], before=cartCount(me); add(g.n); if (cartCount(me)>before){ me.sugg.splice(+sa.dataset.sadd,1); render(); toast(`Añadido a la ronda: ${byN(g.n).t}`); } return; }
    const sn=e.target.closest("[data-sno]"); if(sn){ me.sugg.splice(+sn.dataset.sno,1); render(); return; }
    if (e.target.closest("[data-me]")){ askName("¿CÓMO TE LLAMAS?", "Así sabrán quién pide cada plato.", friend, v=>{ friend=v; render(); }); return; }
    const ph=e.target.closest("[data-ph]"); if(ph){ const it=byN(ph.dataset.ph);
      $("sheet").innerHTML=`<div class="sheet center" id="phS"><div class="box" style="padding:12px;border-color:var(--line)"><img src="${PHOTOS[it.n]}" alt="${esc(it.t)}" style="width:100%;border-radius:14px;display:block">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><b>${it.n} · ${esc(it.t)}</b><button class="x" id="phX">✕</button></div></div></div>`;
      const close=()=>$("sheet").innerHTML=""; $("phX").onclick=close; $("phS").onclick=ev=>{ if(ev.target.id==="phS") close(); }; return; }
    const g=e.target.closest("[data-go]"); if(g){ const el=$(g.dataset.go); if(el) window.scrollTo({top:el.offsetTop-100,behavior:"smooth"}); }
  });
  render();
})();
</script>
</body>
</html>
